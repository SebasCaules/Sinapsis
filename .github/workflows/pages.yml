# Publica el sitio estático en GitHub Pages con cada push a `main`.
#
# El sitio son dos cosas: las materias compiladas (`pnpm build:subjects` escribe
# `apps/web/public/subjects/`, que no se versiona) y la SPA (`vite build`). Como
# el sitio vive en `https://sebascaules.github.io/Sinapsis/`, la SPA se compila
# con `VITE_BASE=/Sinapsis/`.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue por vez; los que se acumulen esperan en vez de cancelarse.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.1

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Compilar las materias
        run: pnpm build:subjects

      - name: Compilar la web
        run: pnpm --filter @sinapsis/web build
        env:
          VITE_BASE: /Sinapsis/

      - name: Subir el artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4
